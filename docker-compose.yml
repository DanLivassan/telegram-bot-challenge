services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Bahia
      GENERIC_TIMEZONE: America/Bahia
      N8N_HOST: https://thin-benz-states-sunrise.trycloudflare.com
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://thin-benz-states-sunrise.trycloudflare.com/
      WEBHOOK_URL: https://thin-benz-states-sunrise.trycloudflare.com/
      # Acesso HTTP apenas para testes locais.
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
